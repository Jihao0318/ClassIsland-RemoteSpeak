name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: RemoteSpeak/RemoteSpeak.csproj
  CIPX: RemoteSpeak/cipx/RemoteSpeak.cipx

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 打 tag 时要求 tag 与 manifest / csproj 的版本一致，避免发出错版本的包。
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')

          $manifestMatch = Select-String -Path 'RemoteSpeak/manifest.yml' -Pattern '^version:\s*(\S+)'
          if (-not $manifestMatch) { throw 'RemoteSpeak/manifest.yml 里找不到 version' }
          $manifestVersion = $manifestMatch.Matches[0].Groups[1].Value.Trim()

          $projectMatch = Select-String -Path 'RemoteSpeak/RemoteSpeak.csproj' -Pattern '<Version>([^<]+)</Version>'
          if (-not $projectMatch) { throw 'RemoteSpeak.csproj 里找不到 <Version>' }
          $projectVersion = $projectMatch.Matches[0].Groups[1].Value.Trim()

          Write-Host "tag=$tag manifest=$manifestVersion csproj=$projectVersion"

          if ($manifestVersion -ne $tag) {
            throw "tag $tag 与 manifest.yml 的 $manifestVersion 不一致"
          }
          if ($projectVersion -ne $tag) {
            throw "tag $tag 与 RemoteSpeak.csproj 的 $projectVersion 不一致"
          }

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      # GenerateHashSummary 必须显式关掉：SDK 的 targets 会把它覆盖成 true 再调 pwsh。
      - name: Build and package
        run: >
          dotnet build ${{ env.PROJECT }} -c Release --no-restore
          -p:CreateCipx=true -p:GenerateHashSummary=false

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path $env:CIPX)) {
            throw "没有生成插件包：$env:CIPX"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:CIPX))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('manifest.yml', 'RemoteSpeak.dll', 'README.md', 'icon.png')) {
              if ($names -notcontains $required) {
                throw "插件包里缺少 $required"
              }
            }
            Write-Host "包内文件：$($names -join ', ')"
          }
          finally {
            $zip.Dispose()
          }

          $size = (Get-Item $env:CIPX).Length
          Write-Host "插件包大小：$size 字节"
          "包大小：$size 字节" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSpeak-cipx
          path: ${{ env.CIPX }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CIPX }}
          generate_release_notes: true
          fail_on_unmatched_files: true
