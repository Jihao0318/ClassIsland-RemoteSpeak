name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: RemoteSpeak/RemoteSpeak.csproj
  CIPX: RemoteSpeak/cipx/RemoteSpeak.cipx

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 发版前先确认 tag 和两处版本号一致，避免发出一个版本对不上的包。
      # tag 可以写三段（v1.0.1）或四段（v1.0.1.0），这里统一补成四段再比。
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $parts = @($tag.Split('.') | Where-Object { $_ -ne '' })

          if ($parts.Count -lt 3 -or $parts.Count -gt 4) {
            throw "tag '$tag' 不是三段或四段的版本号，例如 v1.0.1 或 v1.0.1.0"
          }

          $tagVersion = (@($parts + '0' + '0')[0..3]) -join '.'

          $manifestMatch = Select-String -Path 'RemoteSpeak/manifest.yml' -Pattern '^version:\s*(\S+)'
          if (-not $manifestMatch) { throw 'RemoteSpeak/manifest.yml 里找不到 version' }
          $manifestVersion = $manifestMatch.Matches[0].Groups[1].Value.Trim()

          $projectMatch = Select-String -Path 'RemoteSpeak/RemoteSpeak.csproj' -Pattern '<Version>([^<]+)</Version>'
          if (-not $projectMatch) { throw 'RemoteSpeak.csproj 里找不到 <Version>' }
          $projectVersion = $projectMatch.Matches[0].Groups[1].Value.Trim()

          Write-Host "tag=$tagVersion manifest=$manifestVersion csproj=$projectVersion"

          if ($manifestVersion -ne $tagVersion) {
            throw "tag 版本 $tagVersion 与 manifest.yml 的 $manifestVersion 不一致"
          }
          if ($projectVersion -ne $tagVersion) {
            throw "tag 版本 $tagVersion 与 RemoteSpeak.csproj 的 $projectVersion 不一致"
          }

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      # GenerateHashSummary 必须显式关掉：SDK 的 targets 会把它覆盖成 true，
      # 然后调用 pwsh 生成 MD5；没有 pwsh 的机器会卡死在这里。
      - name: Build and package
        run: >
          dotnet build ${{ env.PROJECT }} -c Release --no-restore
          -p:CreateCipx=true -p:GenerateHashSummary=false

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path $env:CIPX)) {
            throw "没有生成插件包：$env:CIPX"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:CIPX))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('manifest.yml', 'RemoteSpeak.dll', 'README.md')) {
              if ($names -notcontains $required) {
                throw "插件包里缺少 $required"
              }
            }
            Write-Host "包内文件：$($names -join ', ')"
          }
          finally {
            $zip.Dispose()
          }

          $size = (Get-Item $env:CIPX).Length
          Write-Host "插件包大小：$size 字节"
          "包大小：$size 字节" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # 插件市场要求 Release 附带 MD5 校验信息，格式与 SDK 的 generate-md5.ps1 一致。
      # 这里不用 pwsh 脚本自己算，跨平台、也省得再依赖 SDK 的 PowerShell 实现。
      - name: Generate checksums.md
        shell: pwsh
        run: |
          $path = (Resolve-Path $env:CIPX).Path
          $hash = (Get-FileHash -Path $path -Algorithm MD5).Hash
          $json = ConvertTo-Json -InputObject @{ 'RemoteSpeak.cipx' = $hash } -Compress
          $content = "<!-- CLASSISLAND_PKG_MD5 $json -->`n"

          $output = Join-Path $env:GITHUB_WORKSPACE 'checksums.md'
          [System.IO.File]::WriteAllText($output, $content, (New-Object System.Text.UTF8Encoding($false)))

          Write-Host $content
          "MD5：$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # 发布前跑一遍无头测试：协议、Token、日志、自愈重绑都在里面。
      - name: Run tests
        run: dotnet run -c Release --project ServerCheck

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSpeak-cipx
          path: |
            ${{ env.CIPX }}
            checksums.md
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CIPX }}
            checksums.md
          generate_release_notes: true
          fail_on_unmatched_files: true
