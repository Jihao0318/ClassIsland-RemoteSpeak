name: Build Android

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # runner 自带 Android SDK 和 cmdline-tools；不再用 setup-android，
      # 它内部会执行 `sdkmanager tools`，而新版 SDK 已经没有这个包了。
      - name: Install platform and build tools
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          for dir in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            export PATH="$dir:$PATH"
          done
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # 固定签名，放在仓库 Secret 里；换签名会导致老用户无法覆盖安装。
      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PKEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks \
            -PKEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PKEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSpeak-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
